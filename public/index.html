<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RICO Agent - Full Stack Multi-MCP Interface</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                    <span class="logo-text">RICO Agent</span>
                </div>
                <span class="status-badge" id="connectionStatus">جاري الاتصال...</span>
            </div>
            <div class="header-center">
                <div class="model-selector">
                    <select id="modelSelect" aria-label="اختر النموذج">
                        <option value="mohamedazooz/rico">RICO (mohamedazooz/rico)</option>
                        <option value="meta-llama/Llama-3.2-3B-Instruct">Llama 3.2 3B</option>
                        <option value="Qwen/Qwen2.5-7B-Instruct">Qwen 2.5 7B</option>
                        <option value="mistralai/Mistral-7B-Instruct-v0.3">Mistral 7B</option>
                    </select>
                </div>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="themeToggleBtn" aria-label="تبديل المظهر">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>
                <button class="icon-btn" id="telegramBtn" aria-label="Telegram">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.198 2.433a2.242 2.242 0 0 0-1.022.215l-8.609 3.33c-2.068.8-3.986 1.543-5.664 2.224l-2.538 1.03c-.852.344-1.59.69-2.205 1.03-.614.34-.855.63-.855.86 0 .23.24.52.855.86.615.34 1.353.685 2.205 1.03l2.538 1.03c1.678.68 3.596 1.425 5.664 2.225l8.609 3.33a2.242 2.242 0 0 0 1.022.215c.62 0 1.165-.31 1.36-.87.196-.56.04-1.2-.4-1.63l-4.05-3.93-6.88-1.02c-.2-.03-.36-.19-.36-.39 0-.2.16-.36.36-.39l6.88-1.02 4.05-3.93c.44-.43.596-1.07.4-1.63-.195-.56-.74-.87-1.36-.87z"/>
                    </svg>
                </button>
                <button class="icon-btn" id="langToggleBtn" aria-label="تبديل اللغة">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"/>
                        <polyline points="17 11 17 21 9 21"/>
                    </svg>
                </button>
                <button class="icon-btn" id="searchBtn" aria-label="بحث في المحادثة">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </button>
                <button class="icon-btn" id="statsBtn" aria-label="الإحصائيات">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10"/>
                        <line x1="12" y1="20" x2="12" y2="4"/>
                        <line x1="6" y1="20" x2="6" y2="14"/>
                    </svg>
                </button>
                <button class="icon-btn" id="exportBtn" aria-label="تصدير المحادثة">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                </button>
                <button class="icon-btn" id="settingsBtn" aria-label="الإعدادات">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
                <button class="icon-btn" id="mcpStatusBtn" aria-label="حالة MCPs">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2"/>
                        <path d="M8 21h8M12 17v4"/>
                    </svg>
                    <span class="badge" id="mcpBadge">0/7</span>
                </button>
            </div>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-area" role="main" aria-label="محادثة RICO Agent">
            <div class="messages" id="messages" role="log" aria-live="polite">
                <div class="message system-message">
                    <div class="message-avatar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="sender-name" id="welcomeName"></span>
                            <span class="message-time" id="welcomeTime"></span>
                        </div>
                        <div class="message-text" id="welcomeMessage"></div>
                    </div>
                </div>
            </div>

            <!-- Tool Execution Display -->
            <div class="tool-execution" id="toolExecution" hidden>
                <div class="tool-header">
                    <span class="tool-name" id="toolName"></span>
                    <span class="tool-server" id="toolServer"></span>
                </div>
                <div class="tool-args" id="ToolArgs"></div>
                <div class="tool-result" id="toolResult"></div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-toolbar">
                    <button class="tool-btn" id="attachBtn" aria-label="إرفاق ملف">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.49"/>
                        </svg>
                    </button>
                    <input type="file" id="fileInput" hidden multiple accept="image/*,.pdf,.txt,.md,.json,.py,.js,.ts,.html,.css,.csv,.xlsx">
                    <button class="tool-btn" id="codeBtn" aria-label="إدراج كود">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="16 18 22 12 16 6"/>
                            <polyline points="8 6 2 12 8 18"/>
                        </svg>
                    </button>
                    <button class="tool-btn" id="voiceInputBtn" aria-label="إدخال صوتي">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        </svg>
                    </button>
                </div>
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        placeholder="اكتب رسالتك هنا..."
                        rows="1"
                        aria-label="رسالتك"
                    ></textarea>
                    <div id="filePreview" class="file-preview hidden"></div>
                </div>
                <div class="input-actions">
                    <div class="input-hints">
                        <kbd>Enter</kbd> إرسال · <kbd>Shift+Enter</kbd> سطر جديد
                    </div>
                    <button class="btn btn-primary" id="sendBtn" aria-label="إرسال">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
